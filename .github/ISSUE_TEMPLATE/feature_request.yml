name: Feature Request
description: Propose an enhancement or filter hook
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use Case
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Design
      description: Describe the expected behavior, hook signature, or option semantics.
    validations:
      required: true
